name: Validate portal
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27028:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix backend -- --max-warnings 0
      - run: npm test --prefix backend
      - run: npm run lint --prefix frontend -- --max-warnings 0
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix backend --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
