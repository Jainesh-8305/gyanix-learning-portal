services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/gyanix
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-5.4-mini}
      CHAT_EMBEDDING_MODEL: ${CHAT_EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_SEMANTIC_SEARCH: ${CHAT_SEMANTIC_SEARCH:-true}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      mongodb:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  mongo_data:
